name: Monthly Report Update

on:
  schedule:
    - cron: '0 8 2 * *' # 2nd of every month at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install looker-sdk python-dateutil

      - name: Run monthly update
        env:
          LOOKER_BASE_URL: ${{ secrets.LOOKER_BASE_URL }}
          LOOKER_CLIENT_ID: ${{ secrets.LOOKER_CLIENT_ID }}
          LOOKER_CLIENT_SECRET: ${{ secrets.LOOKER_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python rex_concepts_monthly_update.py

      - name: Commit cache files
        run: |
          git config user.email "bot@rexconcepts.com"
          git config user.name "elena-bot"
          # cache/ is intentionally ignored for local development, so force-add
          # the successful workflow's immutable query snapshots.
          git add -f cache/
          git diff --staged --quiet || git commit -m "Cache: cohort data for $(date +%Y-%m)"
          git push
